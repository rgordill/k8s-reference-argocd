apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-daily
  labels:
    app.kubernetes.io/part-of: cloudnative-pg
    app.kubernetes.io/component: postgresql
spec:
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: postgres
  method: barmanObjectStore
