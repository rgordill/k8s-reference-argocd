apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg-operator
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    name: in-cluster
    namespace: cnpg-system
  source:
    path: manifests/cloudnative-pg/olm/operator
    repoURL: https://github.com/rgordill/k8s-reference-argocd.git
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
