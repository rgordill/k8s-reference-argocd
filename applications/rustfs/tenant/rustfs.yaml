apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rustfs
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  destination:
    name: in-cluster
    namespace: rustfs
  source:
    repoURL: https://github.com/rgordill/k8s-reference-argocd.git
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
